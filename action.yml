name: gpipe
description: Generate install.sh, install.ps1, and checksums.txt for GitHub releases
author: thomaslaurenson

inputs:
  version:
    description: Release version tag (e.g. v1.2.3). Passed to gpipe, which validates it as a semantic version.
    required: false
    default: ${{ github.ref_name }}
  repo:
    description: GitHub repository in owner/repo format
    required: false
    default: ${{ github.repository }}
  config:
    description: Path to .gpipe.yml config file relative to repo root
    required: false
    default: .gpipe.yml
  cosign_sign:
    description: "Sign checksums.txt with cosign after generation. Requires id-token: write."
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install cosign
      if: inputs.cosign_sign == 'true'
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    # setup-go rather than the runner's Go: the image ships a version that may
    # be older than go.mod requires, and GOTOOLCHAIN=local forbids a download.
    #
    # go-version-file is action_path-qualified because setup-go resolves paths
    # against the caller's workspace, not this action's directory; cache is off
    # for the same reason, since its key would come from the caller's go.sum.
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: ${{ github.action_path }}/go.mod
        cache: false

    # Built from this action's own checkout: github.action_path holds gpipe at
    # exactly the ref the caller requested, so authenticity comes from the ref
    # itself, with no version pin or checksum to keep in sync.
    #
    # GOTOOLCHAIN=local pins the build to the Go installed above. Version is
    # stamped from github.action_ref so the Gpipe-Version header records what
    # the caller pinned, and is empty for a local (uses: ./) checkout.
    - name: Build gpipe
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        GOTOOLCHAIN: local
        GPIPE_REF: ${{ github.action_ref }}
      run: |
        go build \
          -ldflags="-s -w -X github.com/thomaslaurenson/gpipe/cmd.Version=${GPIPE_REF:-dev}" \
          -o "$RUNNER_TEMP/gpipe" .

    # All action inputs are passed to shell steps via the environment rather
    # than interpolated into the script with ${{ }}. GitHub expands ${{ }} into
    # the script source before the shell runs, so interpolating an input (e.g.
    # a tag name, which may legally contain shell metacharacters) directly into
    # a run block is a script-injection vector. Referencing "$ENV_VAR" instead
    # keeps the value out of the script text and safely quoted.
    - name: Run gpipe generate
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        GPIPE_REPO: ${{ inputs.repo }}
        GPIPE_TAG: ${{ inputs.version }}
        GPIPE_CONFIG: ${{ inputs.config }}
        GPIPE_SIGN: ${{ inputs.cosign_sign }}
      run: |
        args=(--repo "$GPIPE_REPO" --version "$GPIPE_TAG" --config "$GPIPE_CONFIG")
        if [[ "$GPIPE_SIGN" == "true" ]]; then
          args+=(--sign)
        fi
        "$RUNNER_TEMP/gpipe" generate "${args[@]}"
