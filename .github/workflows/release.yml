name: Release

on:
  workflow_call

# Minimum permissions required:
# - contents: write  to create the GitHub release and upload assets
# - id-token: write  to obtain the OIDC token for cosign keyless signing
permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-24.04
    # Serialize releases so two tag pushes cannot race on the force-pushed
    # major-version tag below.
    concurrency:
      group: release-major-tag
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Extract release notes from CHANGELOG.md
        run: make get_changelog TAG=${GITHUB_REF_NAME} > /tmp/release-notes.md

      - name: Build binaries
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: build --clean
        env:
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      - name: Generate install scripts and checksums
        run: |
          ./dist/gpipe-linux-x86_64 generate \
            --repo "${{ github.repository }}" \
            --version "${{ github.ref_name }}" \
            --sign

      - name: Create GitHub release and upload assets
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file /tmp/release-notes.md \
            dist/gpipe-* \
            install.sh \
            install.ps1 \
            checksums.txt \
            checksums.txt.sigstore.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # This repository is also the action, so consumers write
      # `uses: thomaslaurenson/gpipe@v1`. That ref has to exist and has to
      # follow releases, otherwise every consumer pinned to the major line
      # fails to resolve the action at all. Moved after the release is
      # published so the tag never points at a build that did not ship.
      - name: Move floating major-version tag
        env:
          # Read the pushed tag from the environment rather than interpolating
          # ${{ }} into the script, so a crafted tag name cannot inject shell.
          TAG: ${{ github.ref_name }}
        run: |
          # Derive the major tag from the release tag (v1.4.0 -> v1) so that
          # v2+ releases move the correct tag instead of always moving v1.
          major="${TAG%%.*}"
          if [[ ! "$major" =~ ^v[0-9]+$ ]]; then
            echo "Refusing to move major tag: unexpected tag name '$TAG'" >&2
            exit 1
          fi
          git tag -f "$major"
          git push origin "$major" --force
