name: Release

on:
  workflow_call

# Minimum permissions required:
# - contents: write  to create the GitHub release and upload assets
# - id-token: write  to obtain the OIDC token for cosign keyless signing
permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Extract release notes from CHANGELOG.md
        run: make get_changelog TAG=${GITHUB_REF_NAME} > /tmp/release-notes.md

      - name: Build binaries
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: build --clean
        env:
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      - name: Generate install scripts and checksums
        run: |
          ./dist/gpipe-linux-x86_64 generate \
            --repo "${{ github.repository }}" \
            --version "${{ github.ref_name }}" \
            --sign

      - name: Create GitHub release and upload assets
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file /tmp/release-notes.md \
            dist/gpipe-* \
            install.sh \
            install.ps1 \
            checksums.txt \
            checksums.txt.sigstore.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Optional fast path; gpipe-action's daily schedule covers the same
      # ground. Needs a PAT because GITHUB_TOKEN cannot dispatch cross-repo,
      # and the token is checked in-script because the secrets context is not
      # available in step conditionals.
      - name: Notify gpipe-action of the new release
        env:
          GH_TOKEN: ${{ secrets.GPIPE_ACTION_DISPATCH_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "GPIPE_ACTION_DISPATCH_TOKEN not set: skipping dispatch."
            echo "gpipe-action will pick up ${TAG} on its next scheduled sync."
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY_OWNER}/gpipe-action/dispatches" \
            --method POST \
            --field event_type=gpipe-released \
            --field "client_payload[version]=${TAG}"
