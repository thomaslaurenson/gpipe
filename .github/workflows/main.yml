name: Main

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "**.go"
      - go.mod
      - go.sum
      - .goreleaser*.yml
      - Makefile

# Permissions are declared at the called workflow level.
# Inherited here via secrets: inherit.
permissions: {}

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  test:
    uses: ./.github/workflows/test.yml

  prerelease:
    needs: [lint, test]
    uses: ./.github/workflows/prerelease.yml
    secrets: inherit
