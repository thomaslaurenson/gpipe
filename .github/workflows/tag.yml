name: Tag

on:
  push:
    tags: ['v*']

# Permissions are declared at the called workflow level.
# Inherited here via secrets: inherit.
permissions: {}

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: [lint, test]
    uses: ./.github/workflows/release.yml
    secrets: inherit
